id = "herdr-lazydocker"
name = "Lazydocker"
version = "0.1.0"
description = "Run lazydocker in a herdr split pane or its own tab."
min_herdr_version = "0.7.0"
platforms = ["linux", "macos"]

[[panes]]
id = "lazydocker"
title = "lazydocker"
placement = "split"
command = ["lazydocker"]

[[actions]]
id = "open-lazydocker"
title = "Open lazydocker"
description = "Open lazydocker in a split pane."
command = ["bash", "scripts/open-lazydocker.sh"]

[[actions]]
id = "open-lazydocker-tab"
title = "Open lazydocker (tab)"
description = "Open lazydocker in its own tab."
command = ["bash", "scripts/open-lazydocker-tab.sh"]
