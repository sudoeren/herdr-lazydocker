id = "herdr-lazydocker"
name = "Lazydocker"
version = "0.0.1"
description = "Run lazydocker in a herdr split pane or tab with a smart open/focus/close toggle."
min_herdr_version = "0.7.0"
platforms = ["linux", "macos"]

[[panes]]
id = "lazydocker"
title = "lazydocker"
placement = "split"
command = ["lazydocker"]

[[actions]]
id = "open-lazydocker"
title = "Open lazydocker"
description = "Toggle lazydocker in a split pane (open / focus / close)."
command = ["bash", "scripts/open-lazydocker.sh"]

[[actions]]
id = "open-lazydocker-tab"
title = "Open lazydocker (tab)"
description = "Toggle lazydocker in its own tab (open / switch / close)."
command = ["bash", "scripts/open-lazydocker-tab.sh"]
